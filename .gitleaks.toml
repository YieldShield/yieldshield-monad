title = "YieldShield secret scanning"
[extend]
useDefault = true

# Keep default generic API-key detection and scope its false-positive exceptions
# to this rule. Global path allowlists skip entire files before matching secrets.
[[rules]]
id = "generic-api-key"

# Public EVM addresses are identifiers, not credentials. Match the entire secret.
[[rules.allowlists]]
description = "Public EVM addresses"
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']

# A code hash recorded by an imported deployment; this is not a signing key.
[[rules.allowlists]]
description = "Historical deployment code hashes"
condition = "AND"
paths = ['''^contracts/deployments/history/46630/gen-1784273997897-28161ae24b7d9b27\.json$''']
regexTarget = "match"
regexes = ['''YSToken"\s*:\s*"0x[0-9a-fA-F]{64}''']

[[rules.allowlists]]
description = "Public release commit and deployment identifiers"
condition = "AND"
paths = ['''^docs/evidence/expanded-release\.json$''']
regexTarget = "match"
regexes = ['''apiCommit"\s*:\s*"[0-9a-f]{40}''', '''apiDeployment"\s*:\s*"[0-9a-f-]{36}''']

# This public Railway deployment ID appeared in an earlier scanner fixture.
# Retain its exact finding exception for history without excluding the test file.
[[rules.allowlists]]
description = "Known public deployment identifier in scanner controls"
condition = "AND"
paths = ['''^scripts/check-secret-scanner\.mjs$''']
regexTarget = "secret"
regexes = ['''^3b977f83-eb55-4afc-8b33-13c81de781f2$''']

# Standard Anvil mnemonic, account 9. Never fund it on a public network.
[[rules.allowlists]]
description = "Public Anvil development key in the localhost Makefile"
condition = "AND"
paths = ['''^contracts/Makefile$''']
regexTarget = "secret"
regexes = ['''^0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6$''']

[[rules]]
id = "evm-private-key-assignment"
description = "EVM signing key assigned to a private-key variable"
regex = '''(?i)(?:private[_-]?key)["']?\s*(?::\s*[a-z_$][a-z0-9_.$<>\[\]| \t]{0,80})?\s*[?:=]{1,2}\s*["']?((?:0x)?[0-9a-f]{64})\b'''
secretGroup = 1
keywords = ["private_key", "privatekey", "private-key"]

[[rules.allowlists]]
description = "Public Anvil development key in the localhost Makefile"
condition = "AND"
paths = ['''^contracts/Makefile$''']
regexTarget = "secret"
regexes = ['''^0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6$''']

[[rules]]
id = "evm-private-key-argument"
description = "EVM signing key passed as a command-line argument"
regex = '''(?i)--private[_-]?key(?:\s+|=)\s*["']?((?:0x)?[0-9a-f]{64})\b'''
secretGroup = 1
keywords = ["--private-key", "--private_key", "--privatekey"]

[[rules]]
id = "evm-private-key-account"
description = "EVM signing key passed directly to viem account construction"
regex = '''(?i)\bprivateKeyToAccount\s*\(\s*["']((?:0x)?[0-9a-f]{64})\b'''
secretGroup = 1
keywords = ["privatekeytoaccount"]

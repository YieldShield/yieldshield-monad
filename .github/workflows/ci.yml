name: Monad release checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: monad-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check pinned contract dependencies
        run: |
          node --test contracts/scripts-js/__tests__/foundry-lock.test.cjs
          node contracts/scripts-js/check-foundry-lock.cjs
      - run: npm ci --ignore-scripts
      - run: npm run check:scope
      - run: npm run test:monad
      - run: npm run test:web
      - run: npm run build
      - name: Contract deployment tool regressions
        run: |
          if [ -L contracts/node_modules ]; then unlink contracts/node_modules; fi
          npm ci --prefix contracts --ignore-scripts
          npm run test:scripts --prefix contracts
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.1
      - name: Monad adapter and lifecycle tests
        run: forge test --root contracts --match-path 'test/monad/*.t.sol'
      - name: Imported immutable-module regressions
        run: forge test --root contracts --match-path 'test/base-modules/*.t.sol'
      - name: Check delivery script syntax
        run: |
          node --check scripts/deploy-monad.mjs
          node --check scripts/deploy-monad-reference.mjs
          node --check scripts/deploy-monad-redstone-reference.mjs
          node --check scripts/smoke-monad.mjs
          node --check scripts/verify-monad.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: monad-web
          path: apps/monad-web/dist
          retention-days: 14

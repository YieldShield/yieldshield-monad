version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /services/monad
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /contracts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    # Deployed bytecode is tied to foundry.lock. Upgrade these libraries only
    # with a reviewed lockfile, source verification, and deployment plan.
    ignore:
      - dependency-name: contracts/lib/openzeppelin-contracts
      - dependency-name: contracts/lib/openzeppelin-contracts-upgradeable
